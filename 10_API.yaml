# Схемы событий ситуационного центра — кейс 4
# Не REST API, а JSON-схемы входа (от датчиков и приложения)
# Проверить на https://www.jsonschemavalidator.net/

$schema: "https://json-schema.org/draft/2020-12/schema"
title: SituationCenterEvents
description: Набор схем событий для ситуационного центра

$defs:

  # ОБРАЗЕЦ — не трогать
  TelemetryEvent:
    type: object
    required: [event_id, time, location, indicator, value]
    additionalProperties: false
    properties:
      event_id:
        type: string
        pattern: '^evt_[A-Za-z0-9]{6,32}$'
      time:
        type: string
        format: date-time
      location:
        type: string
        pattern: '^site_[0-9]{2}$'
      indicator:
        enum: [temperature, humidity, ventilation]
      value:
        type: number
      signature:
        type: string
        description: HMAC-SHA256 подпись события (защита от подмены)

  # TODO — заполните
  IncidentEvent: 
    type: object
    required: [incident_id, type, location, time, status, deadline]
    properties:
      incident_id:
        type: string 
        pattern: ^inc_[0-9]{3}$
        description: Номер инцидента из 3-х значного числа.
      type:
        enum: [temperature, ventilation, humidity,equipment,other]
      location:
        type: string 
        pattern: ^site_[0-9]{2}$
        description: проверяется, что участок есть в sites.csv
      time:
        type: string 
        format: date-time
      responsible:
        type: ["string", "null"]
        description: номер ответственного или "null", если он пока не назначен
      status:
        enum: [NEW,ASSIGNED,IN_PROGRESS,CLOSED]
      source:
        enum: [mobile,sensor,auto]
      deadline:
        type: string
        format: date-time
        description: Срок решения инцидента 

  # TODO — заполните
  AlertEvent:
    type: object
    required: [alert_id, severity, at]
    properties:
      alert_id:
        type: string 
        pattern: ^alrt_[0-9]{4}$
      measurement_id:
        type: string
        description: FK на Measurement
      severity:
        enum: [WARNING,CRITICAL, STALE]
      action:
        enum: [ALERT_CREATED,ESCALATED,DUPLICATE]
        description: что система делает с алертом
      at:
        type: string 
        format: date-time

  # TODO — заполните
  TransitionRequest: #запрос на смену статуса
    type: object
    required: [incident_id, to, actor]
    properties:
      incident_id:
        type: string 
        pattern: ^inc_[0-9]{3}$
      to:
        enum: [ASSIGNED, IN_PROGRESS, CLOSED]
        description: NEW запрашивать нельзя, тк это начальный статус
      actor:
        type: string 
        description: кто просит перевести в статус - роль или user_id
      comment:
        type: ["string", "null"]
        description: Комментарий. Не обязателен
      responsible: 
        type: ["string", "null"]
        description: Ответственный. Нужен при переходе в ASSIGNED
      resolution_reason:
        enum: [RESOLVED, NO_ACTION, null]
        description: Причина закрытия. NO_ACTION — ложный вызов (разрешает ASSIGNED → CLOSED)

  # TODO — заполните
  Error:
    type: object
    required: [error_code, message]
    properties:
      error_code:
        enum: [VALIDATION_ERROR,UNKNOWN_LOCATION,INVALID_TRANSITION,DUPLICATE_EVENT,SENSOR_SIGNATURE_INVALID]
      message:
        type: string
        description: сообщение для читающего ошибку
      retryable:
        type: boolean
        description: Можно ли повторить запрос без изменений? (true — временный сбой, false — исправьте данные)
      details:
        type: object
        description: детали ошибки (location)

examples:

  valid_telemetry:
    event_id: evt_ab12cd
    time: "2025-11-01T08:00:00Z"
    location: site_01
    indicator: temperature
    value: 28.3
    signature: "hmac:..."

  valid_incident:
    incident_id: inc_001
    type: temperature
    location: site_01
    time: "2025-11-01T08:00:00Z"
    responsible: null
    status: NEW
    source: sensor

  invalid_location:
    incident_id: inc_999
    type: temperature
    location: site_99       # не из sites.csv
    time: "2025-11-01T08:00:00Z"
    status: NEW

  invalid_transition:
    incident_id: inc_001
    to: CLOSED               # напрямую из NEW нельзя
    actor: e_101